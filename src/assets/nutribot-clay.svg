<svg xmlns="http://www.w3.org/2000/svg" width="120" height="150" viewBox="0 0 120 150" role="img" aria-labelledby="titulo">
  <title id="titulo">NutriBot Clay, asistente de Nutrik</title>

  <!--
    NutriBot Clay: muñeco 3D del asistente.
    Se dibuja SIN círculo de fondo para que se use directamente sobre el panel.
    Fondo transparente + degradados suaves = look arcilla/3D, no emoji ni icono plano.
    Colores alineados con el verde esmeralda que ya usa Nutrik.
  -->
  <defs>
    <radialGradient id="nc-mint" cx="32%" cy="20%" r="80%">
      <stop offset="0" stop-color="#e4fcf1" />
      <stop offset="0.58" stop-color="#8ad6b0" />
      <stop offset="1" stop-color="#2f9b70" />
    </radialGradient>
    <linearGradient id="nc-mintDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fae84" />
      <stop offset="1" stop-color="#237a55" />
    </linearGradient>
    <linearGradient id="nc-pantalla" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b4a3a" />
      <stop offset="1" stop-color="#0b2a22" />
    </linearGradient>
    <linearGradient id="nc-hoja" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ce079" />
      <stop offset="1" stop-color="#2f8f3e" />
    </linearGradient>
    <linearGradient id="nc-frasco" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#dbe7df" />
    </linearGradient>
    <filter id="nc-sombra" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#12452c" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- El grupo se centra y se ajusta para caber en el botón de 62 px sin recortes -->
  <g transform="translate(60 75) scale(0.88)">
    <!-- Sombra de contacto: da profundidad sin dibujar un círculo de fondo -->
    <ellipse cx="0" cy="66" rx="36" ry="7" fill="#12452c" opacity="0.12" />

    <!-- Antena con hoja: identidad de NutryBot -->
    <path d="M0,-40 L-2,-60" stroke="#2f7d55" stroke-width="5" stroke-linecap="round" />
    <path d="M-2,-58 C-12,-76 -34,-74 -32,-60 C-20,-50 -6,-52 -2,-58 Z" fill="url(#nc-hoja)" />
    <path d="M-28,-60 Q-16,-62 -4,-58" stroke="#1f6b32" stroke-width="1.5" fill="none" opacity="0.5" />

    <!-- Cabeza redondeada con brillo de arcilla -->
    <rect x="-44" y="-40" width="88" height="76" rx="26" fill="url(#nc-mint)" filter="url(#nc-sombra)" />
    <ellipse cx="-20" cy="-24" rx="16" ry="10" fill="#ffffff" opacity="0.25" transform="rotate(-20 -20 -24)" />

    <!-- Cara en pantalla LED -->
    <rect x="-32" y="-26" width="64" height="44" rx="16" fill="url(#nc-pantalla)" />
    <ellipse cx="-14" cy="-6" rx="7" ry="8" fill="#a8f0d0" />
    <ellipse cx="14" cy="-6" rx="7" ry="8" fill="#a8f0d0" />
    <circle cx="-12" cy="-4" r="2.4" fill="#0b2a22" />
    <circle cx="16" cy="-4" r="2.4" fill="#0b2a22" />
    <circle cx="-24" cy="8" r="3.5" fill="#7de3bd" opacity="0.5" />
    <circle cx="24" cy="8" r="3.5" fill="#7de3bd" opacity="0.5" />
    <path d="M-10,8 Q0,17 10,8" stroke="#a8f0d0" stroke-width="2.6" fill="none" stroke-linecap="round" />

    <!-- Cuerpo tipo frasco con la N de Nutrik -->
    <rect x="-36" y="36" width="72" height="48" rx="20" fill="url(#nc-mintDark)" />
    <circle cx="0" cy="60" r="12" fill="#ffffff" opacity="0.95" />
    <text x="0" y="65" text-anchor="middle" font-size="14" font-weight="800" fill="#2f9b70">N</text>

    <!-- Suplemento que sostiene y brazos que lo abrazan -->
    <rect x="-10" y="48" width="20" height="30" rx="6" fill="url(#nc-frasco)" stroke="#cbd8cf" stroke-width="1.5" />
    <rect x="-6" y="44" width="12" height="6" rx="2" fill="#2f9b70" />
    <rect x="-7" y="58" width="14" height="5" rx="2.5" fill="#4f9e3f" opacity="0.9" />
    <path d="M-32,48 Q-22,64 -10,60" stroke="#3f9b70" stroke-width="8" fill="none" stroke-linecap="round" />
    <path d="M32,48 Q22,64 10,60" stroke="#3f9b70" stroke-width="8" fill="none" stroke-linecap="round" />
  </g>
</svg>
